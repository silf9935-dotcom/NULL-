name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Validate JSON resources, texture and translations
        run: python3 scripts/validate_resources.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Build mod and run verification tasks
        run: gradle --no-daemon clean build

      - name: Upload distributable mod jar
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: null-remnant-fabric-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
